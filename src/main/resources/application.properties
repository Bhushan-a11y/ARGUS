spring.application.name=riskai
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=risk-analyzer:latest
spring.ai.ollama.chat.temperature=0
spring.ai.ollama.embedding.model=mxbai-embed-large:335m


spring.ai.model.chat=ollama
spring.ai.google.genai.api-key=${GOOGLE_API_KEY:}
spring.ai.google.genai.chat.model=gemini-3.6-flash

#News api settings (Newsdata.io)
#gdelt.news.api.url = https://api.gdeltproject.org/api/v2/doc/doc
google.news.api.url = https://news.google.com/rss/search

#redis settings
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}

# TiDB Configuration (Application Data)
app.datasource.tidb.url=${TIDB_URL:jdbc:mysql://localhost:4000/appdb}
app.datasource.tidb.username=${TIDB_USERNAME:root}
app.datasource.tidb.password=${TIDB_PASSWORD:root}
app.datasource.tidb.driver-class-name=com.mysql.cj.jdbc.Driver

# PostgreSQL Configuration (PGVector)
app.datasource.pgvector.url=${PGVECTOR_URL:jdbc:postgresql://localhost:5432/ragdb}
app.datasource.pgvector.username=${PGVECTOR_USERNAME:postgres}
app.datasource.pgvector.password=${PGVECTOR_PASSWORD:postgres}
app.datasource.pgvector.driver-class-name=org.postgresql.Driver
spring.ai.vectorstore.pgvector.initialize-schema=true

spring.security.oauth2.client.registration.google.client-id=1024205425932-7imb65tk9bg96u0qjidv8tft6pu4fu90.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email